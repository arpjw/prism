name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine hatchling

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: prism-signal ${{ github.ref_name }}
          body: |
            ## prism-signal ${{ github.ref_name }}

            Install from PyPI:
            ```bash
            pip install prism-signal==${{ github.ref_name }}
            ```

            See [CHANGELOG](https://github.com/arpjw/prism/blob/main/CHANGELOG.md) for details.
          files: dist/*
