[project]
name = "prism-signal"
version = "0.1.0"
description = "Connector framework for velocity signal engines"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "rich>=13.0.0",
  "websockets>=12.0",
  "python-dotenv>=1.0.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Investment",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://prism.aryasomu.com"
Repository = "https://github.com/arpjw/prism"
Documentation = "https://prism.aryasomu.com/docs"
"Bug Tracker" = "https://github.com/arpjw/prism/issues"

[project.scripts]
prism = "prism.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "prism/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["prism"]
